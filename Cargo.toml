[workspace]
resolver = "3"
default-members = [
  "components/bello-hardwared",
  "components/bello-visualizer",
]
members = [
  "components/bello-camera-api",
  "components/cog-protocol",
  "components/bello-hardware-api",
  "components/bello-hardware-client",
  "components/bello-hardware-e2e",
  "components/bello-hardwared",
  "components/bello-pose-api",
  "components/bello-mujoco",
  "components/bello-robot-description",
  "components/bello-state-estimatord",
  "components/bello-visualizer",
  "components/robstride-emulator",
  "components/robstride-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
cog-protocol = { path = "components/cog-protocol" }
anyhow = "1"
async-stream = "0.3"
bello-hardware-api = { path = "components/bello-hardware-api" }
bello-hardware-client = { path = "components/bello-hardware-client" }
bello-hardwared = { path = "components/bello-hardwared" }
bello-pose-api = { path = "components/bello-pose-api" }
bello-robot-description = { path = "components/bello-robot-description" }
clap = "4"
crossbeam-channel = "0.5"
futures-core = "0.3"
gilrs = "0.11"
gsusbio = { version = "0.1.0", default-features = false, features = ["tokio"] }
nix = "0.29"
parking_lot = "0.12"
prost = "0.14"
nalgebra = "0.34"
rcgen = "0.14"
robstride-emulator = { path = "components/robstride-emulator" }
robstride-protocol = { path = "components/robstride-protocol" }
serde = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
roxmltree = "0.21"
serialport = { version = "4", default-features = false }
socketcan = { version = "3.6", default-features = false }
thiserror = "2"
tempfile = "3"
tokio = "1"
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = "1"

# The pure-Rust JPEG encoder is in the live stereo path. Unoptimized image code
# can reduce simulated camera output below 10 Hz even for small frames.
[profile.dev.package.image]
opt-level = 3

# Generic image encoding is monomorphized in this crate; optimize the caller too.
[profile.dev.package.bello-mujoco]
opt-level = 3
