# Fixed invisible base. Hip kp/kd defaults are per motor (combined stiffness 100, damping 4).
urdf: ../../../descriptions/bello_mini_torso/urdf/bello_mini_torso.urdf
hardware:
  endpoint: http://127.0.0.1:50051
root:
  source: fixed
refresh_hz: 60
control_profiles:
  torso_pitch:
    command_rate_hz: 50
    validity_ms: 500
    telemetry_staleness_ms: 200
    position_slew_rate: 0.25
    velocity:
      min: -1.0
      max: 1.0
      default: 0.0
    torque_feedforward:
      min: -40.0
      max: 40.0
      default: 0.0
    kp:
      min: 0.0
      max: 150.0
      default: 50.0
    kd:
      min: 0.0
      max: 5.0
      default: 2.0
  waist:
    command_rate_hz: 50
    validity_ms: 500
    telemetry_staleness_ms: 200
  upper_body:
    command_rate_hz: 50
    validity_ms: 500
    telemetry_staleness_ms: 200
  left_gripper:
    command_rate_hz: 50
    validity_ms: 100
    telemetry_staleness_ms: 250
    position_slew_rate: 0.5
    velocity: { min: -2.0, max: 2.0, default: 0.0 }
    torque_feedforward: { min: -5.0, max: 5.0, default: 0.0 }
    kp: { min: 0.0, max: 100.0, default: 20.0 }
    kd: { min: 0.0, max: 1.0, default: 0.5 }
  right_gripper:
    command_rate_hz: 50
    validity_ms: 100
    telemetry_staleness_ms: 250
    position_slew_rate: 0.5
    velocity: { min: -2.0, max: 2.0, default: 0.0 }
    torque_feedforward: { min: -5.0, max: 5.0, default: 0.0 }
    kp: { min: 0.0, max: 100.0, default: 20.0 }
    kd: { min: 0.0, max: 1.0, default: 0.5 }
