# Seven-axis Milly with STEP cover visuals and inherited inertias.
# joint_3 is the added RS10P with +/-90 deg travel.
# Its direction and encoder zero remain provisional.
urdf: ../../../descriptions/milly-7dof/urdf/milly-7dof-dual.urdf
hardware:
  endpoint: http://127.0.0.1:50051
root:
  source: fixed
refresh_hz: 60
control_profiles:
  dual_arm:
    command_rate_hz: 50
    validity_ms: 500
    telemetry_staleness_ms: 250
    position_slew_rate: 0.5
    velocity:
      min: -2.0
      max: 2.0
      default: 0.0
    torque_feedforward:
      min: -5.0
      max: 5.0
      default: 0.0
    kp:
      min: 0.0
      max: 100.0
      default: 20.0
    kd:
      min: 0.0
      max: 1.0
      default: 0.5
