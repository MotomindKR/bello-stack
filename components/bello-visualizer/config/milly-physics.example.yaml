# MuJoCo test profile: stronger gravity-loaded arm holding gains.
# Physical robot commissioning must use its own calibrated gains.
urdf: ../../../descriptions/milly/urdf/milly.urdf
hardware:
  endpoint: http://127.0.0.1:50051
root:
  source: fixed
refresh_hz: 60

control_profiles:
  arm:
    command_rate_hz: 50
    validity_ms: 500
    telemetry_staleness_ms: 250
    position_slew_rate: 0.5
    velocity: { min: -2.0, max: 2.0, default: 0.0 }
    torque_feedforward: { min: -5.0, max: 5.0, default: 0.0 }
    kp: { min: 0.0, max: 100.0, default: 100.0 }
    kd: { min: 0.0, max: 5.0, default: 3.0 }
