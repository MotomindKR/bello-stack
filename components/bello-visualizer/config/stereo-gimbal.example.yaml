# Direction and encoder-zero calibration must precede hardware control.
urdf: ../../../descriptions/stereo-gimbal/urdf/stereo-gimbal.urdf
hardware:
  endpoint: http://127.0.0.1:50051
root:
  source: fixed
refresh_hz: 60
control_profiles:
  gimbal:
    command_rate_hz: 50
    validity_ms: 500
    telemetry_staleness_ms: 250
    position_slew_rate: 0.2
    velocity:
      min: -0.2
      max: 0.2
      default: 0.0
    torque_feedforward:
      min: -1.0
      max: 1.0
      default: 0.0
    kp:
      min: 0.0
      max: 20.0
      default: 5.0
    kd:
      min: 0.0
      max: 1.0
      default: 0.5
