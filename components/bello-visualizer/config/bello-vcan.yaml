# Canonical Bello description used by the local MuJoCo-backed vCAN emulator.
urdf: ../../../descriptions/bello/full_body/urdf/bello_full_body.urdf
hardware:
  endpoint: http://127.0.0.1:50051
  # endpoint: http://192.168.0.8:50051
root:
  # Simulation ground truth served directly by bello-run-emulator.
  source: external_pose
  endpoint: http://127.0.0.1:50052
  reference_frame: odom
  tracked_frame: pelvis_link
  staleness_ms: 200
refresh_hz: 60

# Command limits come from the live hardwared inventory.
control_profiles:
  lower_body:
    command_rate_hz: 50
    validity_ms: 500
    telemetry_staleness_ms: 200
  upper_body:
    command_rate_hz: 50
    validity_ms: 500
    telemetry_staleness_ms: 200
