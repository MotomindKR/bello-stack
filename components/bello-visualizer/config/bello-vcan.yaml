# Full Bello sphere-hand model for the vCAN emulator.
# Generate the MJCF first with:
#   cd ~/bello_mujoco && uv run bello-prepare-assets --config-name visualizer
mjcf: ../../../../bello_mujoco/assets/generated/visualizer/full_body/mjcf/bello_full_body_viewer.xml
hardware:
  endpoint: http://127.0.0.1:50051
root:
  source: external_pose
  endpoint: http://127.0.0.1:50052
  reference_frame: odom
  tracked_frame: pelvis_link
  staleness_ms: 200
refresh_hz: 60

# Position limits and initial values come directly from the matching MJCF
# position actuators. These are emulator command dynamics, not approved
# physical-hardware gains.
control_profiles:
  lower_body:
    command_rate_hz: 50
    validity_ms: 100
    telemetry_staleness_ms: 200
  upper_body:
    command_rate_hz: 50
    validity_ms: 100
    telemetry_staleness_ms: 200
