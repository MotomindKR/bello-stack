[package]
name = "bello-visualizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bello-hardware-client.workspace = true
bello-pose-api.workspace = true
bello-robot-description.workspace = true
clap = { workspace = true, features = ["derive"] }
crossbeam-channel.workspace = true
kiss3d = { version = "0.45", features = ["egui"] }
nalgebra.workspace = true
parking_lot.workspace = true
rfd = "0.15"
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
stl_io = "0.11"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
async-stream.workspace = true
futures-core.workspace = true
tempfile.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
