[package]
name = "bello-visualizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
bello-hardware-client.workspace = true
bello-pose-api.workspace = true
bello-robot-description.workspace = true
clap = { workspace = true, features = ["derive"] }
crossbeam-channel.workspace = true
futures-core.workspace = true
# Remove the fork pin after https://github.com/dimforge/kiss3d/issues/400 is released.
kiss3d = { git = "https://github.com/gmmyung/kiss3d.git", rev = "3bf15c6775263be2f4969e4c0f4e4bdf22fc15d3", features = ["egui"] }
nalgebra.workspace = true
parking_lot.workspace = true
rfd = "0.15"
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
stl_io = "0.11"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile.workspace = true
