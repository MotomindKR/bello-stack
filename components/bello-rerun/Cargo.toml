[package]
name = "bello-rerun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Rerun telemetry observer for Bello hardwared"

[dependencies]
anyhow.workspace = true
bello-hardware-api.workspace = true
clap = { workspace = true, features = ["derive"] }
rerun.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { workspace = true, features = ["tls-native-roots", "tls-ring", "transport"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
nix = { workspace = true, features = ["signal"] }
tempfile.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
