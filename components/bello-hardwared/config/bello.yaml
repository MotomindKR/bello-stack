runtime:
  telemetry_capacity: 4096

grpc:
  # Keep control local unless the deployment adds authenticated transport security.
  listen: 127.0.0.1:50051
  default_lease_ms: 1000
  maximum_lease_ms: 5000

serial_devices:
  - name: imu_serial
    port: /dev/ttyUSB0
    baud_rate: 921600
    timeout_ms: 100
    reconnect: { initial_delay_ms: 100, maximum_delay_ms: 5000 }

imus:
  - name: imu
    serial_device: imu_serial
    stale_timeout_ms: 500
    output_rate_hz: 500

buses:
  - name: can_a
    interface: can0
    host_id: 253
    bitrate: 1000000 # Must match the externally configured classic CAN interface.
    maximum_utilization: 0.75
    reconnect: { initial_delay_ms: 100, maximum_delay_ms: 5000 }
  - name: can_b
    interface: can1
    host_id: 253
    bitrate: 1000000 # Must match the externally configured classic CAN interface.
    maximum_utilization: 0.75
    reconnect: { initial_delay_ms: 100, maximum_delay_ms: 5000 }

motors:
  - name: motor_a
    joint: joint_a
    bus: can_a
    id: 1
    model: ROBSTRIDE_03
    direction: 1
    health: &motor_health
      safe_position_min: -12.57
      safe_position_max: 12.57
      temperature_warning_c: 60.0
      maximum_temperature_c: 80.0
      temperature_recovery_c: 75.0
      temperature_recovery_duration_ms: 2000
    command_policy: &command_policy
      maximum_position_step: 0.5
      limit: clamp
      position_step: fault
    fault_damping_kd: 2.0
  - name: motor_b
    joint: joint_b
    bus: can_b
    id: 1
    model: ROBSTRIDE_03
    direction: -1
    health: *motor_health
    command_policy: *command_policy
    fault_damping_kd: 2.0
  - name: motor_c
    joint: joint_c
    bus: can_a
    id: 2
    model: ROBSTRIDE_03
    direction: 1
    health: *motor_health
    command_policy: *command_policy
    fault_damping_kd: 2.0
  - name: motor_d
    joint: joint_d
    bus: can_b
    id: 2
    model: ROBSTRIDE_03
    direction: -1
    health: *motor_health
    command_policy: *command_policy
    fault_damping_kd: 2.0

# Groups are arbitrary ownership units. Groups may span and share buses; each
# motor belongs to exactly one group.
motor_groups:
  - name: group_alpha
    motors: [motor_a, motor_b]
    control_rate_hz: 250.0
    command_timeout_ms: 100
    feedback_timeout_ms: 100
    enable_timeout_ms: 500
    enable_retries: 3
    fault_policy: &fault_policy
      default: damping
      overrides:
        temperature: disable
        reported_motor_fault: disable
  - name: group_beta
    motors: [motor_c, motor_d]
    control_rate_hz: 250.0
    command_timeout_ms: 100
    feedback_timeout_ms: 100
    enable_timeout_ms: 500
    enable_retries: 3
    fault_policy: *fault_policy
