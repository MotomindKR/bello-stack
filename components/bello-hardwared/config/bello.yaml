description: ../../../descriptions/bello/hardware.yaml

runtime:
  telemetry_capacity: 4096
  motor_velocity_filter:
    cutoff_hz: 15.0

grpc:
  listen: { type: tcp, address: 0.0.0.0:50051 }
  default_lease_ms: 1000
  maximum_lease_ms: 5000

bus_interfaces: { can0: can0, can1: can1 }
serial_ports: { imu_serial: /dev/ttyACM0 }

enabled_groups: [lower_body, upper_body]
