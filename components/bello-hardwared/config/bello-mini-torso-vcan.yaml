# Motor zeros and inherited sensor/serial bindings require confirmation on the installed torso.
description: ../../../descriptions/bello_mini_torso/hardware.yaml
runtime:
  telemetry_capacity: 4096
  motor_velocity_filter:
    cutoff_hz: 10.0
  imu_filter:
    orientation_cutoff_hz: 10.0
    gyro_cutoff_hz: 10.0
    acceleration_cutoff_hz: 10.0
grpc:
  listen:
  - type: tcp
    address: 127.0.0.1:50051
  default_lease_ms: 1000
  maximum_lease_ms: 5000
bus_transports:
  can0: { type: socketcan, interface: vcan0 }
  can1: { type: socketcan, interface: vcan1 }
  can2: { type: socketcan, interface: vcan2 }
  can3: { type: socketcan, interface: vcan3 }
serial_ports:
  imu_serial: /dev/ttyIMU
  power_board_serial: /dev/ttyPOWER
enabled_power_boards:
- power_board
enabled_groups:
- torso_pitch
- waist
- upper_body
