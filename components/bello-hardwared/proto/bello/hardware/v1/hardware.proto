syntax = "proto3";

package bello.hardware.v1;

// Provides exclusive motor-group control and read-only hardware telemetry.
service HardwareService {
  // Returns the configured hardware topology and current component states.
  rpc ListHardware(ListHardwareRequest) returns (ListHardwareResponse);

  // Streams selected telemetry until the client disconnects.
  rpc WatchTelemetry(WatchTelemetryRequest) returns (stream WatchTelemetryResponse);

  // Acquires exclusive command ownership of one motor group.
  rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);

  // Extends an existing command lease.
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);

  // Relinquishes command ownership.
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);

  // Moves a group from Idle to Enabled after hardware checks pass.
  rpc EnableGroup(EnableGroupRequest) returns (EnableGroupResponse);

  // Moves a group from Enabled to Running when a fresh command exists.
  rpc StartControl(StartControlRequest) returns (StartControlResponse);

  // Moves a group from Running to Enabled and applies damping.
  rpc StopControl(StopControlRequest) returns (StopControlResponse);

  // Stops the motors and moves an enabled or running group to Idle.
  rpc DisableGroup(DisableGroupRequest) returns (DisableGroupResponse);

  // Clears motor faults and moves a faulted group to Idle.
  rpc RecoverGroup(RecoverGroupRequest) returns (RecoverGroupResponse);

  // Explicitly applies the configured fault response and faults a group.
  rpc FaultGroup(FaultGroupRequest) returns (FaultGroupResponse);

  // Accepts complete impedance-command snapshots and acknowledges each one.
  rpc StreamCommands(stream StreamCommandsRequest) returns (stream StreamCommandsResponse);
}

message ListHardwareRequest {}

// Lifecycle shared by physical transports and sensor drivers.
enum DeviceState {
  DEVICE_STATE_UNSPECIFIED = 0;
  DEVICE_STATE_DISABLED = 1;
  DEVICE_STATE_STARTING = 2;
  DEVICE_STATE_CONNECTING = 3;
  DEVICE_STATE_ONLINE = 4;
  DEVICE_STATE_DEGRADED = 5;
  DEVICE_STATE_RECONNECTING = 6;
  DEVICE_STATE_FAULT = 7;
  DEVICE_STATE_SHUTDOWN = 8;
}

message DeviceStatus {
  DeviceState state = 1;
  string detail = 2;
  uint64 transition_count = 3;
}

message MotorAddress {
  string bus = 1;
  uint32 id = 2;
}

message BusInfo {
  reserved 4, 5;
  reserved "state", "detail";

  string name = 1;
  string interface = 2;
  uint32 host_id = 3;
  DeviceStatus status = 6;
}

message SerialDeviceInfo {
  string name = 1;
  string port = 2;
  uint32 baud_rate = 3;
  DeviceStatus status = 4;
}

message ImuInfo {
  string name = 1;
  string serial_device = 2;
  string model = 3;
  DeviceStatus status = 4;
}

message MotorHealthInfo {
  double safe_position_min = 1;
  double safe_position_max = 2;
  double temperature_warning_c = 3;
  double maximum_temperature_c = 4;
  double temperature_recovery_c = 5;
  uint64 temperature_recovery_duration_ms = 6;
}

message MotorCommandPolicyInfo {
  double maximum_position_step = 1;
  string limit_action = 2;
  string limit_severity = 3;
  string position_step_action = 4;
  string position_step_severity = 5;
}

message MotorFaultDampingInfo {
  double kd = 1;
}

message MotorInfo {
  reserved 7;
  reserved "required";

  string name = 1;
  string joint = 2;
  string group = 3;
  MotorAddress address = 4;
  string model = 5;
  int32 direction = 6;
  DeviceStatus status = 8;
  MotorHealthInfo health = 9;
  MotorCommandPolicyInfo command_policy = 10;
  MotorFaultDampingInfo fault_damping = 11;
}

message FaultResponseInfo {
  string cause = 1;
  string response = 2;
}

message GroupInfo {
  string name = 1;
  double control_rate_hz = 2;
  string state = 3;
  repeated MotorAddress motors = 4;
  repeated FaultResponseInfo fault_responses = 5;
  uint32 damping_send_count = 6;
  double damping_send_rate_hz = 7;
}

message ListHardwareResponse {
  reserved 4;
  reserved "imu_health";

  repeated BusInfo buses = 1;
  repeated MotorInfo motors = 2;
  repeated GroupInfo groups = 3;
  repeated SerialDeviceInfo serial_devices = 5;
  repeated ImuInfo imus = 6;
}

message AcquireLeaseRequest {
  string group = 1;
  string client_name = 2;
  uint64 requested_duration_ms = 3;
}

message AcquireLeaseResponse {
  reserved 1, 2;
  reserved "success", "message";

  string group = 3;
  string token = 4;
  uint64 expires_in_ms = 5;
}

message RenewLeaseRequest {
  string token = 1;
  uint64 requested_duration_ms = 2;
}

message RenewLeaseResponse {
  reserved 1, 2;
  reserved "success", "message";

  string group = 3;
  string token = 4;
  uint64 expires_in_ms = 5;
}

message ReleaseLeaseRequest {
  string token = 1;
}

message ReleaseLeaseResponse {
  bool success = 1;
  string message = 2;
  string state = 3;
}

message EnableGroupRequest {
  string group = 1;
  string lease_token = 2;
}

message EnableGroupResponse {
  bool success = 1;
  string message = 2;
  string state = 3;
}

message StartControlRequest {
  string group = 1;
  string lease_token = 2;
}

message StartControlResponse {
  bool success = 1;
  string message = 2;
  string state = 3;
}

message StopControlRequest {
  string group = 1;
  string lease_token = 2;
}

message StopControlResponse {
  bool success = 1;
  string message = 2;
  string state = 3;
}

message DisableGroupRequest {
  string group = 1;
  string lease_token = 2;
}

message DisableGroupResponse {
  bool success = 1;
  string message = 2;
  string state = 3;
}

message RecoverGroupRequest {
  string group = 1;
  string lease_token = 2;
}

message RecoverGroupResponse {
  bool success = 1;
  string message = 2;
  string state = 3;
}

message FaultGroupRequest {
  string group = 1;
  string lease_token = 2;
  string reason = 3;
}

message FaultGroupResponse {
  bool success = 1;
  string message = 2;
  string state = 3;
}

message MotorCommand {
  string motor_name = 1;
  double position = 2;
  double velocity = 3;
  double torque_feedforward = 4;
  double kp = 5;
  double kd = 6;
}

message StreamCommandsRequest {
  string group = 1;
  string lease_token = 2;
  uint64 sequence = 3;
  uint64 valid_for_ms = 4;
  repeated MotorCommand commands = 5;
}

message StreamCommandsResponse {
  string group = 1;
  uint64 sequence = 2;
  bool accepted = 3;
  string message = 4;
  string state = 5;
}

message WatchTelemetryRequest {
  repeated string groups = 1;
  bool include_motors = 2;
  bool include_imu = 3;
  bool include_health = 4;
  // Empty selects every configured IMU when include_imu is true.
  repeated string imus = 5;
  bool include_command_policy_events = 6;
}

message MotorTelemetry {
  string group = 1;
  string motor_name = 2;
  MotorAddress address = 3;
  double position = 4;
  double velocity = 5;
  double torque = 6;
  double temperature = 7;
  uint32 fault_bits = 8;
  uint32 mode_status = 9;
  uint64 feedback_age_ms = 10;
  DeviceStatus status = 11;
}

message ImuTelemetry {
  reserved 1;
  reserved "health";

  repeated double orientation_xyzw = 2;
  repeated double angular_velocity_xyz = 3;
  repeated double linear_acceleration_xyz = 4;
  uint64 device_timestamp_ms = 5;
  uint64 sample_age_ms = 6;
  string imu_name = 7;
  string serial_device = 8;
  DeviceStatus status = 9;
}

message GroupTelemetry {
  string group = 1;
  string state = 2;
  string fault_reason = 3;
  string lease_owner = 4;
  uint64 command_count = 5;
  uint64 control_tick = 6;
  int64 jitter_us = 7;
}

message CommandPolicyTelemetry {
  string group = 1;
  string motor_name = 2;
  string check = 3;
  string severity = 4;
  string detail = 5;
  bool command_modified = 6;
  bool command_rejected = 7;
  string response = 8;
}

message HealthTelemetry {
  reserved 2, 3;
  reserved "status", "detail";

  string component = 1;
  uint64 dropped_events = 4;
  DeviceStatus device_status = 5;
}

message WatchTelemetryResponse {
  uint64 monotonic_ns = 1;
  oneof payload {
    MotorTelemetry motor = 2;
    ImuTelemetry imu = 3;
    GroupTelemetry group = 4;
    HealthTelemetry health = 5;
    CommandPolicyTelemetry command_policy = 6;
  }
}
