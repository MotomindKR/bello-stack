[package]
name = "bello-hardwared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Monolithic Robstride and EBIMU hardware daemon"

[dependencies]
cog-protocol.workspace = true
anyhow.workspace = true
async-stream.workspace = true
bello-hardware-api.workspace = true
bello-robot-description.workspace = true
clap = { workspace = true, features = ["derive"] }
crossbeam-channel.workspace = true
futures-core.workspace = true
nalgebra.workspace = true
gsusbio.workspace = true
parking_lot.workspace = true
robstride-protocol.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
serialport.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["tls-ring", "transport"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true
socketcan.workspace = true
