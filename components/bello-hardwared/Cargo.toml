[package]
name = "bello-hardwared"
version = "0.1.0"
edition = "2024"
license = "Proprietary"
description = "Monolithic Robstride and EBIMU hardware daemon"

[features]
default = []
rerun = ["dep:rerun"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
futures-core = "0.3"
parking_lot = "0.12"
prost = "0.14"
rerun = { version = "0.31.1", optional = true, default-features = false, features = ["sdk"] }
robstride-protocol = { path = "../robstride-protocol" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serialport = { version = "4", default-features = false }
socketcan = { version = "3.6", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14"
