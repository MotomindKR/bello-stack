[package]
name = "bello-hardware-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Process-level CAN and gRPC integration scenarios for Bello hardware"
autobins = false

[features]
camera-tests = ["dep:bello-camera-worker", "dep:gst", "dep:gst-app"]

[target.'cfg(unix)'.dependencies]
bello-camera-worker = { path = "../bello-camera-worker", default-features = false, optional = true }
gst = { package = "gstreamer", version = "0.25", optional = true }
gst-app = { package = "gstreamer-app", version = "0.25", optional = true }

[dependencies]
anyhow.workspace = true
bello-hardwared.workspace = true
robstride-emulator.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[dev-dependencies]
bello-hardware-api.workspace = true
bello-hardware-client.workspace = true
bello-sim-can.workspace = true
nix = { workspace = true, features = ["feature", "signal", "term"] }
rcgen.workspace = true
robstride-protocol.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport"] }
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
cog-protocol.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
socketcan.workspace = true

[[bin]]
name = "hardwared-e2e-fixture"
path = "src/bin/hardwared.rs"
test = false
bench = false

[[bin]]
name = "robstride-emulator-e2e-fixture"
path = "src/bin/robstride_emulator.rs"
test = false
bench = false

[[test]]
name = "vcan"
path = "tests/vcan.rs"

[[test]]
name = "transports"
path = "tests/transports.rs"
