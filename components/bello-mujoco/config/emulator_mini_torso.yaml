# Fixed-base torso emulator; no releasable torso guide is needed.
model: bello_mini_torso.yaml
bus_interfaces: {can0: vcan0, can1: vcan1, can2: vcan2, can3: vcan3}
feedback_rate_hz: 100
temperature_c: 25
command_latency_seconds: 0.0
motor_kp_scale: 1.0
motor_kd_scale: 1.0
imu:
  name: imu
  device: /dev/ttyIMU-mujoco
  rate_hz: 200
  orientation_std_radians: 0.0
  acceleration_std_mps2: 0.0
  seed: 0
power_board:
  name: power_board
  device: /dev/ttyPOWER-mujoco
  battery_voltage_v: 48.0
  battery_current_a: 2.0
  battery_soc_percent: 75.0
  motor_voltage_v: 48.0
  motor_current_a: 1.0
  temperature_c: 30.0
  pressure_pa: 101325.0
  local_rails: [20.0, 0.5, 5.0, 0.2, 3.3, 0.1]
  gpi_bits: 64
  info_bits: 0
  warning_bits: 0
  critical_bits: 0
  mute_telemetry: false
pose:
  listen: 0.0.0.0:50052
  reference_frame: odom
  tracked_frame: base_link
  rate_hz: 100
torso_guide: null
fault_events: {}
video: null
# Set to cameras_mini_torso.yaml to enable the separate 30 Hz renderer.
cameras: null
