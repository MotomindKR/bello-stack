interface: vcan0
host_id: 253
feedback_rate_hz: 500.0

dynamics:
  position_response_hz: 20.0
  idle_velocity_decay_hz: 20.0

actuators:
  - id: 1
    model: ROBSTRIDE_03
    direction: 1
    initial_position: 0.0
    initial_temperature_c: 25.0
  - id: 2
    model: ROBSTRIDE_03
    direction: -1
    initial_position: 0.0
    initial_temperature_c: 25.0

# Events are optional. This example remains healthy by default. Uncomment or add
# events to exercise hardwared fault handling deterministically.
events: []

# Example fault scenario:
# events:
#   - { at_ms: 5000, actuator_id: 1, action: set_temperature, celsius: 85.0 }
#   - { at_ms: 7000, actuator_id: 1, action: set_temperature, celsius: 70.0 }
#   - { at_ms: 10000, actuator_id: 2, action: drop_feedback, enabled: true }
#   - { at_ms: 12000, actuator_id: 2, action: drop_feedback, enabled: false }
#   - { at_ms: 14000, actuator_id: 2, action: set_fault_bits, value: 1 }

