[package]
name = "bello-camera-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Supervised camera capture and local media transport for hardwared"

[features]
default = ["usb"]
usb = ["dep:v4l"]

[[bin]]
name = "bello-camera-worker"
path = "src/main.rs"
required-features = ["usb"]

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
bello-hardware-api.workspace = true
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25", features = ["v1_20"] }
libc = "0.2"
prost.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
v4l = { version = "0.14", optional = true }
