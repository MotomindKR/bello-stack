[build-system]
requires = ["hatchling>=1.30,<2"]
build-backend = "hatchling.build"

[project]
name = "bello-hardware"
version = "0.1.0"
description = "Blocking Python client for the Bello hardware daemon"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "grpcio>=1.84.1,<2",
  "bello-hardware-api==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bello_hardware"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "../api/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../api/src"
python_version = "3.10"
strict = true
files = ["src/bello_hardware", "tests"]
