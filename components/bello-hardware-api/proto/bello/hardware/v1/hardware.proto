syntax = "proto3";

package bello.hardware.v1;

// Provides exclusive motor-group control and read-only hardware telemetry.
service HardwareService {
  rpc ListHardware(ListHardwareRequest) returns (ListHardwareResponse);
  rpc WatchTelemetry(WatchTelemetryRequest) returns (stream WatchTelemetryResponse);
  rpc GetStateFrame(GetStateFrameRequest) returns (GetStateFrameResponse);
  rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);
  rpc EnableGroup(EnableGroupRequest) returns (EnableGroupResponse);
  rpc StartControl(StartControlRequest) returns (StartControlResponse);
  rpc StopControl(StopControlRequest) returns (StopControlResponse);
  rpc DisableGroup(DisableGroupRequest) returns (DisableGroupResponse);
  rpc RecoverGroup(RecoverGroupRequest) returns (RecoverGroupResponse);
  rpc StreamCommands(stream StreamCommandsRequest) returns (stream StreamCommandsResponse);
}

enum DeviceState {
  DEVICE_STATE_UNSPECIFIED = 0;
  DEVICE_STATE_STARTING = 1;
  DEVICE_STATE_CONNECTING = 2;
  DEVICE_STATE_ONLINE = 3;
  DEVICE_STATE_DEGRADED = 4;
  DEVICE_STATE_RECONNECTING = 5;
  DEVICE_STATE_FAULT = 6;
  DEVICE_STATE_SHUTDOWN = 7;
}

enum GroupState {
  GROUP_STATE_UNSPECIFIED = 0;
  GROUP_STATE_IDLE = 1;
  reserved 2;
  reserved "GROUP_STATE_ENABLED";
  GROUP_STATE_RUNNING = 3;
  GROUP_STATE_FAULT = 4;
  GROUP_STATE_SHUTDOWN = 5;
  GROUP_STATE_DAMPED = 6;
}

enum CommandPolicyCheck {
  COMMAND_POLICY_CHECK_UNSPECIFIED = 0;
  COMMAND_POLICY_CHECK_LIMIT = 1;
  COMMAND_POLICY_CHECK_POSITION_STEP = 2;
}

enum CommandBehavior {
  COMMAND_BEHAVIOR_UNSPECIFIED = 0;
  COMMAND_BEHAVIOR_CLAMP = 1;
  COMMAND_BEHAVIOR_REJECT = 2;
  COMMAND_BEHAVIOR_FAULT = 3;
  COMMAND_BEHAVIOR_WARN = 4;
}

enum FaultResponse {
  FAULT_RESPONSE_UNSPECIFIED = 0;
  FAULT_RESPONSE_DAMPING = 1;
  FAULT_RESPONSE_DISABLE = 2;
}

enum GroupCause {
  GROUP_CAUSE_UNSPECIFIED = 0;
  GROUP_CAUSE_ENABLE = 1;
  GROUP_CAUSE_START = 2;
  GROUP_CAUSE_STOP = 3;
  GROUP_CAUSE_COMMAND_TIMEOUT = 4;
  GROUP_CAUSE_DISABLE = 5;
  GROUP_CAUSE_RECOVER = 6;
  GROUP_CAUSE_COMMAND_LIMIT = 7;
  GROUP_CAUSE_COMMAND_POSITION_STEP = 8;
  GROUP_CAUSE_SAFE_POSITION = 9;
  GROUP_CAUSE_STALE_FEEDBACK = 10;
  GROUP_CAUSE_TEMPERATURE = 11;
  GROUP_CAUSE_REPORTED_MOTOR_FAULT = 12;
  GROUP_CAUSE_MODE_STATUS = 13;
  GROUP_CAUSE_COMMUNICATION = 14;
  GROUP_CAUSE_TRANSMISSION = 15;
  GROUP_CAUSE_LEASE_LOSS = 16;
  GROUP_CAUSE_EXIT = 17;
  GROUP_CAUSE_INTERNAL = 18;
}

enum CommandResult {
  COMMAND_RESULT_UNSPECIFIED = 0;
  COMMAND_RESULT_ACCEPTED = 1;
  COMMAND_RESULT_UNKNOWN_GROUP = 2;
  COMMAND_RESULT_LEASE_LOST = 3;
  COMMAND_RESULT_INVALID_STATE = 4;
  COMMAND_RESULT_INCOMPLETE_GROUP = 5;
  COMMAND_RESULT_STALE_SEQUENCE = 6;
  COMMAND_RESULT_UNSAFE = 7;
  COMMAND_RESULT_SUPERSEDED = 8;
  COMMAND_RESULT_CONTROLLER_STOPPED = 9;
  COMMAND_RESULT_EXPIRED = 10;
}

message DeviceStatus {
  DeviceState state = 1;
  string detail = 2;
  uint64 transition_count = 3;
}

message MotorAddress {
  string bus = 1;
  uint32 id = 2;
}

message BusInfo {
  string name = 1;
  string interface = 2;
  uint32 host_id = 3;
  DeviceStatus status = 4;
}

message SerialDeviceInfo {
  string name = 1;
  string port = 2;
  uint32 baud_rate = 3;
  DeviceStatus status = 4;
}

message ImuInfo {
  string name = 1;
  string serial_device = 2;
  DeviceStatus status = 3;
  string source_frame = 4;
  string output_frame = 5;
}

message MotorLimits {
  double position_min = 1;
  double position_max = 2;
  double velocity_min = 3;
  double velocity_max = 4;
  double torque_min = 5;
  double torque_max = 6;
  double kp_min = 7;
  double kp_max = 8;
  double kd_min = 9;
  double kd_max = 10;
}

message MotorInfo {
  string name = 1;
  string coordinate = 2;
  string group = 3;
  MotorAddress address = 4;
  string model = 5;
  int32 direction = 6;
  DeviceStatus status = 7;
  MotorLimits limits = 8;
}

message GroupInfo {
  string name = 1;
  double control_rate_hz = 2;
  GroupState state = 3;
  repeated MotorAddress motors = 4;
}

message ListHardwareRequest {}

message ListHardwareResponse {
  repeated BusInfo buses = 1;
  repeated MotorInfo motors = 2;
  repeated GroupInfo groups = 3;
  repeated SerialDeviceInfo serial_devices = 4;
  repeated ImuInfo imus = 5;
  repeated PowerBoardInfo power_boards = 6;
}

message PowerBoardInfo {
  string name = 1;
  string serial_device = 2;
  string profile = 3;
  uint64 stale_timeout_ms = 4;
  uint64 sync_period_ms = 5;
  DeviceStatus status = 6;
}

message PowerVoltageCurrent {
  double voltage_v = 1;
  double current_a = 2;
}

message PowerBattery {
  double voltage_v = 1;
  double current_a = 2;
  optional double soc_percent = 3;
}

message PowerGpi {
  uint32 bits = 1;
  optional uint32 second_bits = 2;
}

message PowerFlags {
  uint32 bits = 1;
  repeated string active_names = 2;
}

message PowerIwc {
  PowerFlags info = 1;
  PowerFlags warning = 2;
  PowerFlags critical = 3;
}

message PowerLegacyFault {
  PowerFlags alarm = 1;
  PowerFlags fault = 2;
}

message PowerEnvironment {
  double temperature_c = 1;
  double pressure_pa = 2;
}

message PowerLocalRails {
  PowerVoltageCurrent rail_20v0 = 1;
  PowerVoltageCurrent rail_5v0 = 2;
  PowerVoltageCurrent rail_3v3 = 3;
}

message PowerEncoder {
  double left_rpm = 1;
  double right_rpm = 2;
}

// Each packet type is sampled independently. Absence is unknown, never zero.
message PowerBoardSample {
  uint32 sequence = 1;
  uint64 sample_age_ms = 2;
  bool stale = 3;
  oneof reading {
    PowerBattery battery = 4;
    PowerGpi gpi = 5;
    PowerIwc iwc = 6;
    PowerLegacyFault legacy_fault = 7;
    PowerEnvironment environment = 8;
    PowerLocalRails local_rails = 9;
    PowerVoltageCurrent motor_rail = 10;
    uint32 tick_count = 11;
    PowerEncoder encoder = 12;
  }
}

// Bounded latest-value snapshot; a new serial session clears all old readings.
message PowerBoardTelemetry {
  string board_name = 1;
  uint64 connection_generation = 2;
  DeviceStatus status = 3;
  repeated PowerBoardSample samples = 4;
  uint64 invalid_frames = 5;
  uint64 unknown_frames = 6;
}

message AcquireLeaseRequest {
  string group = 1;
  string client_name = 2;
  // Zero selects the server default; nonzero values are clamped to the supported range.
  uint64 requested_duration_ms = 3;
}

message AcquireLeaseResponse {
  string group = 1;
  string token = 2;
  uint64 expires_in_ms = 3;
}

message RenewLeaseRequest {
  string token = 1;
  // Zero selects the server default; nonzero values are clamped to the supported range.
  uint64 requested_duration_ms = 2;
}

message RenewLeaseResponse {
  string group = 1;
  string token = 2;
  uint64 expires_in_ms = 3;
}

message ReleaseLeaseRequest {
  string token = 1;
}

message ReleaseLeaseResponse {
  GroupState state = 1;
}

message EnableGroupRequest {
  string group = 1;
  string lease_token = 2;
}

message EnableGroupResponse {
  GroupState state = 1;
}

message StartControlRequest {
  string group = 1;
  string lease_token = 2;
  // Freshness from server receipt; zero uses, and nonzero is capped by, the group timeout.
  uint64 valid_for_ms = 3;
  repeated MotorCommand commands = 4;
}

message StartControlResponse {
  GroupState state = 1;
}

message StopControlRequest {
  string group = 1;
  string lease_token = 2;
}

message StopControlResponse {
  GroupState state = 1;
}

message DisableGroupRequest {
  string group = 1;
  string lease_token = 2;
}

message DisableGroupResponse {
  GroupState state = 1;
}

message RecoverGroupRequest {
  string group = 1;
  string lease_token = 2;
}

message RecoverGroupResponse {
  GroupState state = 1;
}

message MotorCommand {
  string motor_name = 1;
  double position = 2;
  double velocity = 3;
  double torque_feedforward = 4;
  double kp = 5;
  double kd = 6;
}

message StreamCommandsRequest {
  string group = 1;
  string lease_token = 2;
  uint64 sequence = 3;
  // Freshness from server receipt; zero uses, and nonzero is capped by, the group timeout.
  uint64 valid_for_ms = 4;
  repeated MotorCommand commands = 5;
}

message StreamCommandsResponse {
  string group = 1;
  uint64 sequence = 2;
  CommandResult result = 3;
  string detail = 4;
  GroupState state = 5;
}

message WatchTelemetryRequest {
  repeated string groups = 1;
  bool include_motors = 2;
  bool include_imu = 3;
  bool include_health = 4;
  repeated string imus = 5;
  bool include_command_policy_events = 6;
  bool include_power_boards = 7;
  repeated string power_boards = 8;
}

message MotorTelemetry {
  string group = 1;
  string motor_name = 2;
  double position = 3;
  double velocity = 4;
  double torque = 5;
  double temperature = 6;
  uint32 fault_bits = 7;
  uint32 mode_status = 8;
  uint64 feedback_age_ms = 9;
}

message ImuTelemetry {
  string imu_name = 1;
  Quaternion orientation = 2;
  Vector3 angular_velocity = 3;
  Vector3 linear_acceleration = 4;
  uint64 device_timestamp_ms = 5;
  uint64 sample_age_ms = 6;
}

message Quaternion {
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message GroupTelemetry {
  string group = 1;
  GroupState state = 2;
  reserved 3, 7;
  reserved "fault_detail", "fault_cause";
  uint64 command_count = 4;
  uint64 control_tick = 5;
  int64 jitter_us = 6;
  string detail = 8;
  GroupCause cause = 9;
}

message CommandPolicyTelemetry {
  string group = 1;
  string motor_name = 2;
  CommandPolicyCheck check = 3;
  CommandBehavior behavior = 4;
  string detail = 5;
  bool command_modified = 6;
  bool command_rejected = 7;
  FaultResponse fault_response = 8;
}

message HealthTelemetry {
  string component = 1;
  DeviceStatus device_status = 2;
  uint64 dropped_events = 3;
}

message WatchTelemetryResponse {
  uint64 monotonic_ns = 1;
  oneof payload {
    MotorTelemetry motor = 2;
    ImuTelemetry imu = 3;
    GroupTelemetry group = 4;
    HealthTelemetry health = 5;
    CommandPolicyTelemetry command_policy = 6;
    PowerBoardTelemetry power_board = 7;
  }
}

message GetStateFrameRequest {
  repeated string groups = 1;
  repeated string imus = 2;
}

message StateMotor {
  string group = 1;
  string motor_name = 2;
  double position = 3;
  double velocity = 4;
  double torque = 5;
  double temperature = 6;
  uint32 fault_bits = 7;
  uint32 mode_status = 8;
  uint64 sample_monotonic_ns = 9;
  uint64 sample_age_ns = 10;
}

message StateImu {
  string imu_name = 1;
  Quaternion orientation = 2;
  Vector3 angular_velocity = 3;
  Vector3 linear_acceleration = 4;
  uint64 device_timestamp_ms = 5;
  uint64 sample_monotonic_ns = 6;
  uint64 sample_age_ns = 7;
}

message StateGroup {
  string group = 1;
  GroupState state = 2;
  uint64 command_count = 3;
  uint64 control_tick = 4;
  int64 jitter_us = 5;
  string detail = 6;
  GroupCause cause = 7;
  uint64 sample_monotonic_ns = 8;
  uint64 sample_age_ns = 9;
}

message GetStateFrameResponse {
  uint64 captured_monotonic_ns = 1;
  repeated StateMotor motors = 2;
  repeated StateImu imus = 3;
  repeated StateGroup groups = 4;
  uint64 oldest_sample_age_ns = 5;
  uint64 sample_span_ns = 6;
}
