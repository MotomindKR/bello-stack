[package]
name = "bello-camera-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
gstreamer = ["dep:anyhow", "dep:gst", "dep:gst-app", "dep:tempfile"]

[dependencies]
anyhow = { workspace = true, optional = true }
gst = { package = "gstreamer", version = "0.25", optional = true }
gst-app = { package = "gstreamer-app", version = "0.25", features = ["v1_20"], optional = true }
tempfile = { workspace = true, optional = true }
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tokio = { workspace = true, features = ["sync", "net", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
async-stream.workspace = true
libc = "0.2"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
