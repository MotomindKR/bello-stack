# Stable Milly single-arm hardware identity and protocol settings. This profile
# is adapted from motomind_platform's milly_teleop.yaml; deployment files bind
# the logical CAN bus to a host interface. The source's unused can1 declaration
# is intentionally omitted, and generic torque caps are narrowed to each
# Robstride model's canonical protocol envelope.
robot_description: urdf/milly.urdf

logical_buses:
  - name: can0
    host_id: 0
    bitrate: 1000000
    maximum_utilization: 0.75
    reconnect: { initial_delay_ms: 100, maximum_delay_ms: 5000 }

motors:
  - name: joint_1
    coordinate: joint_1
    bus: can0
    id: 1
    model: ROBSTRIDE_06
    direction: 1
    limits: { position_min: -2.62, position_max: 2.62, velocity_abs: 20.0, torque_abs: 30.0 }
    health:
      safe_position_min: -2.72
      safe_position_max: 2.72
      temperature_warning_c: 60.0
      maximum_temperature_c: 75.0
      temperature_recovery_c: 70.0
      temperature_recovery_duration_ms: 2000
    command_policy: &command_policy
      maximum_position_step: 3.0
      limit: clamp
      position_step: fault
    fault_damping_kd: 10.0

  - name: joint_2
    coordinate: joint_2
    bus: can0
    id: 2
    model: ROBSTRIDE_03
    direction: -1
    limits: { position_min: 0.0, position_max: 3.14, velocity_abs: 20.0, torque_abs: 30.0 }
    health:
      safe_position_min: -0.1
      safe_position_max: 3.24
      temperature_warning_c: 60.0
      maximum_temperature_c: 75.0
      temperature_recovery_c: 70.0
      temperature_recovery_duration_ms: 2000
    command_policy: *command_policy
    fault_damping_kd: 20.0

  - name: joint_3
    coordinate: joint_3
    bus: can0
    id: 3
    model: ROBSTRIDE_06
    direction: -1
    limits: { position_min: 0.0, position_max: 2.97, velocity_abs: 20.0, torque_abs: 30.0 }
    health:
      safe_position_min: -0.1
      safe_position_max: 3.07
      temperature_warning_c: 60.0
      maximum_temperature_c: 75.0
      temperature_recovery_c: 70.0
      temperature_recovery_duration_ms: 2000
    command_policy: *command_policy
    fault_damping_kd: 20.0

  - name: joint_4
    coordinate: joint_4
    bus: can0
    id: 4
    model: ROBSTRIDE_00
    direction: 1
    limits: { position_min: -1.70, position_max: 1.70, velocity_abs: 20.0, torque_abs: 14.0 }
    health:
      safe_position_min: -1.85
      safe_position_max: 1.85
      temperature_warning_c: 60.0
      maximum_temperature_c: 75.0
      temperature_recovery_c: 70.0
      temperature_recovery_duration_ms: 2000
    command_policy: *command_policy
    fault_damping_kd: 10.0

  - name: joint_5
    coordinate: joint_5
    bus: can0
    id: 5
    model: ROBSTRIDE_00
    direction: -1
    limits: { position_min: -1.72, position_max: 1.77, velocity_abs: 20.0, torque_abs: 14.0 }
    health:
      safe_position_min: -1.87
      safe_position_max: 1.92
      temperature_warning_c: 60.0
      maximum_temperature_c: 75.0
      temperature_recovery_c: 70.0
      temperature_recovery_duration_ms: 2000
    command_policy: *command_policy
    fault_damping_kd: 15.0

  - name: joint_6
    coordinate: joint_6
    bus: can0
    id: 6
    model: ROBSTRIDE_05
    direction: 1
    limits: { position_min: -1.5, position_max: 1.5, velocity_abs: 20.0, torque_abs: 5.5 }
    health:
      safe_position_min: -1.6
      safe_position_max: 1.6
      temperature_warning_c: 60.0
      maximum_temperature_c: 75.0
      temperature_recovery_c: 70.0
      temperature_recovery_duration_ms: 2000
    command_policy: *command_policy
    fault_damping_kd: 10.0

  - name: gripper
    coordinate: gripper
    bus: can0
    id: 7
    model: ROBSTRIDE_05
    direction: -1
    limits: { position_min: -2.3, position_max: 0.0, velocity_abs: 20.0, torque_abs: 5.5 }
    health:
      safe_position_min: -2.4
      safe_position_max: 0.1
      temperature_warning_c: 60.0
      maximum_temperature_c: 75.0
      temperature_recovery_c: 70.0
      temperature_recovery_duration_ms: 2000
    command_policy: *command_policy
    fault_damping_kd: 5.0

motor_groups:
  - name: arm
    motors: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6, gripper]
    control_rate_hz: 100.0
    command_refresh_rate_hz: 100.0
    command_timeout_ms: 100
    feedback_timeout_ms: 250
    enable_timeout_ms: 500
    enable_retries: 3
    fault_policy:
      default: damping
