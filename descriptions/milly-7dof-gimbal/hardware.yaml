# Combined model: arms 450 mm apart; gimbal centred at the base-plane midpoint.
# One daemon owns CAN0 for left arm and gimbal; CAN1 owns the right arm.
# Gimbal directions -1 are user-confirmed on the actuators; encoder zeros remain pending.
robot_description: urdf/milly-7dof-gimbal.urdf
logical_buses:
- name: can0
  host_id: 0
  bitrate: 1000000
  maximum_utilization: 0.75
  reconnect:
    initial_delay_ms: 100
    maximum_delay_ms: 5000
- name: can1
  host_id: 0
  bitrate: 1000000
  maximum_utilization: 0.75
  reconnect:
    initial_delay_ms: 100
    maximum_delay_ms: 5000
