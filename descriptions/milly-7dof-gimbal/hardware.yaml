- name: left_joint_1
  coordinate: left_joint_1
  bus: can0
  id: 1
  model: ROBSTRIDE_06
  direction: 1
  limits:
    position_min: -2.8
    position_max: 2.8
    velocity_abs: 20.0
    torque_abs: 30.0
  health:
    safe_position_min: -2.95
    safe_position_max: 2.95
    temperature_warning_c: 60.0
    maximum_temperature_c: 75.0
    temperature_recovery_c: 70.0
