# Seven-axis Milly; original axes use sign-mapped SDK position ranges.
# Source and command/feedback distinction: ../milly-7dof/sdk-limits.json.
# Added joint_3 has user-specified +/-90 deg travel; J3 direction -1 follows the actuator; encoder zero is calibrated on the robot.

robot_description: urdf/milly-7dof-dual-o6.urdf

logical_buses:
  - name: can0
    host_id: 0
    bitrate: 1000000
    maximum_utilization: 0.75
    reconnect: { initial_delay_ms: 100, maximum_delay_ms: 5000 }
  - name: can1
    host_id: 0
    bitrate: 1000000
    maximum_utilization: 0.75
    reconnect: { initial_delay_ms: 100, maximum_delay_ms: 5000 }

motors:
  - name: left_joint_1
    coordinate: left_joint_1
    bus: can0
    id: 1
    model: RS_06
    direction: 1
    limits: { position_min: -2.8, position_max: 2.8, velocity_abs: 20.0, torque_abs: 30.0 }
    health:
      safe_position_min: -2.95
      safe_position_max: 2.95
      temperature_warning_c: 60.0
      maximum_temperature_c: 75.0
      temperature_recovery_c: 70.0
      temperature_recovery_duration_ms: 2000
    command_policy: &command_policy
      maximum_position_step: 3.0
      limit: reject
      position_step: fault
    fault_damping_kd: 5.0
  - name: left_joint_2
    coordinate: left_joint_2
    bus: can0
    id: 2
    model: RS_03
    direction: -1
    limits: { position_min: 0, position_max: 3.2, velocity_abs: 20.0, torque_abs: 30.0 }
    health:
      safe_position_min: -0.15
      safe_position_max: 3.35
      temperature_warning_c: 60.0
      maximum_temperature_c: 75.0
      temperature_recovery_c: 70.0
      temperature_recovery_duration_ms: 2000
    command_policy: *command_policy
    fault_damping_kd: 10.0
