    motors:
    - left_joint_1
    - left_joint_2
    - left_joint_3
    - left_joint_4
    - left_joint_5
    - left_joint_6
    - left_joint_7
    - right_joint_1
    - right_joint_2
    - right_joint_3
    - right_joint_4
    - right_joint_5
    - right_joint_6
    - right_joint_7
    control_rate_hz: 100.0
    command_refresh_rate_hz: 100.0
    command_timeout_ms: 100
    feedback_timeout_ms: 250
    enable_timeout_ms: 500
    enable_retries: 3
    fault_policy:
      default: damping
