# Provisional Bello Mini profile; physical calibration is still required.
# Identity and CAD direction candidates come from motor_topology.yaml.
# Direct directions assume protocol-positive matches CAD motor-frame +Z.
# All four ankle directions are operator-confirmed -1; the URDF owns their
# observation-derived differential candidate.
# Encoder zeros must match URDF zero; hardwared has no encoder-offset setting.
# Transport, health, and control policy defaults follow the Bello profile.
robot_description: urdf/bello_mini.urdf

logical_buses:
  - name: can0
    host_id: 0
    bitrate: 1000000
    maximum_utilization: 0.75
    reconnect: { initial_delay_ms: 100, maximum_delay_ms: 5000 }
  - name: can1
    host_id: 0
    bitrate: 1000000
    maximum_utilization: 0.75
    reconnect: { initial_delay_ms: 100, maximum_delay_ms: 5000 }

serial_devices:
  - name: power_board_serial
    baud_rate: 921600
    timeout_ms: 100
    reconnect: { initial_delay_ms: 100, maximum_delay_ms: 5000 }
  - name: imu_serial
    baud_rate: 115200
    timeout_ms: 100
    reconnect: { initial_delay_ms: 100, maximum_delay_ms: 5000 }

imus:
  - name: imu
    serial_device: imu_serial
    source_frame: imu_sensor_link
    output_frame: imu_link
    stale_timeout_ms: 1000
    output_rate_hz: 100

power_boards:
  - name: power_board
    serial_device: power_board_serial
    profile: agx
    sync_period_ms: 1000
    stale_timeout_ms: 3000

motors:
  - name: waist_yaw_motor
    coordinate: waist_yaw_joint
    bus: can0
    id: 51
    model: ROBSTRIDE_03
    direction: -1
    health: &motor_health
      safe_position_min: -12.57
      safe_position_max: 12.57
      feedback_position_tolerance: 0.4
      temperature_warning_c: 60.0
      maximum_temperature_c: 95.0
      temperature_recovery_c: 75.0
      temperature_recovery_duration_ms: 2000
    command_policy: &command_policy
      maximum_position_step: 2.0
      limit: clamp
      position_step: reject
    fault_damping_kd: 15.0
  - { name: waist_roll_motor, coordinate: waist_roll_joint, bus: can0, id: 52, model: ROBSTRIDE_03, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 15.0 }
  - { name: left_hip_pitch_motor, coordinate: left_hip_pitch_joint, bus: can0, id: 61, model: ROBSTRIDE_04, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 40.0 }
  - { name: left_hip_roll_motor, coordinate: left_hip_roll_joint, bus: can0, id: 62, model: ROBSTRIDE_03, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 15.0 }
  - { name: left_hip_yaw_motor, coordinate: left_hip_yaw_joint, bus: can0, id: 63, model: ROBSTRIDE_03, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 15.0 }
  - { name: left_knee_motor, coordinate: left_knee_joint, bus: can0, id: 64, model: ROBSTRIDE_04, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 40.0 }
  - { name: left_ankle_motor_1, coordinate: left_ankle_motor_1, bus: can0, id: 65, model: ROBSTRIDE_02, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 2.0 }
  - { name: left_ankle_motor_2, coordinate: left_ankle_motor_2, bus: can0, id: 66, model: ROBSTRIDE_02, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 2.0 }
  - { name: right_hip_pitch_motor, coordinate: right_hip_pitch_joint, bus: can0, id: 71, model: ROBSTRIDE_04, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 40.0 }
  - { name: right_hip_roll_motor, coordinate: right_hip_roll_joint, bus: can0, id: 72, model: ROBSTRIDE_03, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 15.0 }
  - { name: right_hip_yaw_motor, coordinate: right_hip_yaw_joint, bus: can0, id: 73, model: ROBSTRIDE_03, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 15.0 }
  - { name: right_knee_motor, coordinate: right_knee_joint, bus: can0, id: 74, model: ROBSTRIDE_04, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 40.0 }
  - { name: right_ankle_motor_1, coordinate: right_ankle_motor_1, bus: can0, id: 75, model: ROBSTRIDE_02, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 2.0 }
  - { name: right_ankle_motor_2, coordinate: right_ankle_motor_2, bus: can0, id: 76, model: ROBSTRIDE_02, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 2.0 }
  - { name: left_shoulder_pitch_motor, coordinate: left_shoulder_pitch_joint, bus: can1, id: 31, model: ROBSTRIDE_03, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 15.0 }
  - { name: left_shoulder_roll_motor, coordinate: left_shoulder_roll_joint, bus: can1, id: 32, model: ROBSTRIDE_03, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 15.0 }
  - { name: left_shoulder_yaw_motor, coordinate: left_shoulder_yaw_joint, bus: can1, id: 33, model: ROBSTRIDE_06, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 3.6 }
  - { name: left_elbow_pitch_motor, coordinate: left_elbow_pitch_joint, bus: can1, id: 34, model: ROBSTRIDE_06, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 3.6 }
  - { name: left_wrist_yaw_motor, coordinate: left_wrist_yaw_joint, bus: can1, id: 35, model: ROBSTRIDE_00, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 2.1 }
  - { name: left_wrist_pitch_motor, coordinate: left_wrist_pitch_joint, bus: can1, id: 36, model: ROBSTRIDE_00, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 2.1 }
  - { name: left_wrist_roll_motor, coordinate: left_wrist_roll_joint, bus: can1, id: 37, model: ROBSTRIDE_00, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 2.1 }
  - { name: right_shoulder_pitch_motor, coordinate: right_shoulder_pitch_joint, bus: can1, id: 41, model: ROBSTRIDE_03, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 15.0 }
  - { name: right_shoulder_roll_motor, coordinate: right_shoulder_roll_joint, bus: can1, id: 42, model: ROBSTRIDE_03, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 15.0 }
  - { name: right_shoulder_yaw_motor, coordinate: right_shoulder_yaw_joint, bus: can1, id: 43, model: ROBSTRIDE_06, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 3.6 }
  - { name: right_elbow_pitch_motor, coordinate: right_elbow_pitch_joint, bus: can1, id: 44, model: ROBSTRIDE_06, direction: -1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 3.6 }
  - { name: right_wrist_yaw_motor, coordinate: right_wrist_yaw_joint, bus: can1, id: 45, model: ROBSTRIDE_00, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 2.1 }
  - { name: right_wrist_pitch_motor, coordinate: right_wrist_pitch_joint, bus: can1, id: 46, model: ROBSTRIDE_00, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 2.1 }
  - { name: right_wrist_roll_motor, coordinate: right_wrist_roll_joint, bus: can1, id: 47, model: ROBSTRIDE_00, direction: 1, health: *motor_health, command_policy: *command_policy, fault_damping_kd: 2.1 }

motor_groups:
  - name: lower_body
    motors: [waist_yaw_motor, waist_roll_motor, left_hip_pitch_motor, left_hip_roll_motor, left_hip_yaw_motor, left_knee_motor, left_ankle_motor_1, left_ankle_motor_2, right_hip_pitch_motor, right_hip_roll_motor, right_hip_yaw_motor, right_knee_motor, right_ankle_motor_1, right_ankle_motor_2]
    control_rate_hz: 100.0
    command_refresh_rate_hz: 50.0
    command_timeout_ms: 500
    feedback_timeout_ms: 100
    enable_timeout_ms: 500
    enable_retries: 3
    fault_policy:
      default: damping
      overrides: { temperature: disable, reported_motor_fault: disable }
  - name: upper_body
    motors: [left_shoulder_pitch_motor, left_shoulder_roll_motor, left_shoulder_yaw_motor, left_elbow_pitch_motor, left_wrist_yaw_motor, left_wrist_pitch_motor, left_wrist_roll_motor, right_shoulder_pitch_motor, right_shoulder_roll_motor, right_shoulder_yaw_motor, right_elbow_pitch_motor, right_wrist_yaw_motor, right_wrist_pitch_motor, right_wrist_roll_motor]
    control_rate_hz: 100.0
    command_refresh_rate_hz: 50.0
    command_timeout_ms: 500
    feedback_timeout_ms: 100
    enable_timeout_ms: 500
    enable_retries: 3
    fault_policy:
      default: damping
      overrides: { temperature: disable, reported_motor_fault: disable }
