schema_version: 2
robot: bello_mini
deployment_status: calibration_required
deployment_blockers:
- RobStride command directions require raw encoder/low-current bench validation
- encoder zero positions are uncalibrated
- ankle differential coefficients/signs are unvalidated
- joint-limit signs reflect user review; physical stops and encoder-zero correspondence
  require validation
can_topology:
  logical_buses:
    can0: waist and left/right legs
    can1: left and right arms
  bitrate_bps: 1000000
  id_policy: original Bello body ranges with IDs increasing along each kinematic chain;
    waist yaw/roll use 51/52
direction_inference_policy:
  cad_positive_axis: motor occurrence local +Z transformed into the URDF frame
  axis_alignment_sign: sign(dot(CAD positive motor axis, reviewed logical joint positive
    axis))
  candidate_command_direction: direct-drive geometric placeholder only, conditional
    on RobStride raw positive matching CAD local +Z
  protocol_limitation: RobStride documentation does not bind raw-positive rotation
    to the STEP frame; hardware command_direction remains null until bench validation
  differential_limitation: ankle alignment is a pitch-axis projection, not a standalone
    motor direction or calibrated differential row
motor_model_catalog:
  source:
    revision: 6ad12f50006273b7ea4eea88980f927d97c22f0d
    specification_date: '2026-07-13'
    url: https://github.com/RobStride/Product_Information
  models:
    ROBSTRIDE_00:
      mass_kg: 0.31
      mass_tolerance_kg: 0.003
      peak_torque_nm: 14.0
      maximum_speed_rad_s: 33.0
    ROBSTRIDE_02:
      mass_kg: 0.38
      mass_tolerance_kg: 0.003
      peak_torque_nm: 17.0
      maximum_speed_rad_s: 44.0
    ROBSTRIDE_03:
      mass_kg: 0.9
      mass_tolerance_kg: 0.02
      peak_torque_nm: 60.0
      maximum_speed_rad_s: 20.0
    ROBSTRIDE_04:
      mass_kg: 1.42
      mass_tolerance_kg: 0.02
      peak_torque_nm: 120.0
      maximum_speed_rad_s: 15.0
    ROBSTRIDE_06:
      mass_kg: 0.621
      mass_tolerance_kg: null
      peak_torque_nm: 36.0
      maximum_speed_rad_s: 50.0
