version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-grpc:
        patterns:
          - "tonic*"
          - "prost*"
    ignore:
      # Upgrade the bindings together with native MuJoCo in flake.nix.
      - dependency-name: mujoco-rs
  - package-ecosystem: pip
    directories:
      - /components/bello-hardware-api
      - /components/bello-hardware-python
      - /components/bello-hand
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      grpc-runtime:
        patterns:
          - grpcio
          - protobuf
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
