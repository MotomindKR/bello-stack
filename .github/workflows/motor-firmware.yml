name: Check upstream motor firmware

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/motor-firmware.yml'
      - 'components/bello-hardwared/firmware/**'
      - 'scripts/check-motor-firmware.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Compare bundled images with RobStride's latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh api repos/RobStride/Product_Information/releases/latest | python3 scripts/check-motor-firmware.py
