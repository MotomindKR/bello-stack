name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Format
        run: nix develop --command cargo fmt --all --check
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: nix develop --command cargo test --workspace --all-features
      - name: Protobuf format and lint
        run: |
          nix develop --command buf format --diff --exit-code
          nix develop --command buf lint
      - name: Generated Python protobuf bindings
        run: |
          nix develop --command python components/bello-hardware-python/scripts/generate_proto.py
          git diff --exit-code -- components/bello-hardware-python/src/bello_hardware/_generated
      - name: Python client
        working-directory: components/bello-hardware-python
        run: |
          nix develop --command ruff format --check .
          nix develop --command ruff check .
          nix develop --command mypy src/bello_hardware tests
          nix develop --command pytest
          nix develop --command python -m hatchling build
      - name: Upper-body teleop
        working-directory: components/bello-upper-body-teleop
        run: |
          nix develop --command ruff format --check .
          nix develop --command ruff check .
          nix develop --command mypy src/bello_upper_body_teleop tests
          nix develop --command pytest
          nix develop --command python -m hatchling build

  vcan-integration:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Create vcan interface
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set dev vcan0 up
      - name: Run ignored vcan integration test
        run: nix develop --command cargo e2e
