name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Format
        run: nix develop --command cargo fmt --all --check
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: nix develop --command cargo test --workspace --all-features
      - name: Check dual Milly physics and stereo projection
        run: |
          nix develop --command cargo run -p bello-sim -- check --config components/bello-sim/config/milly_7dof_gimbal.yaml
          nix develop --command cargo test -p bello-sim --lib rendered_markers_match_calibrated_pixels_through_pitch_yaw_and_roll -- --ignored
      - name: Check preview renderer failure
        run: |
          nix develop --command sh -ec 'cargo build -p bello-sim --example camera_preview
            python components/bello-sim/tests/camera_preview.py "$CARGO_TARGET_DIR/debug/examples/camera_preview"'
      - name: Protobuf format and lint
        run: |
          nix develop --command buf format --diff --exit-code
          nix develop --command buf lint
      - name: Generated Python protobuf bindings
        run: |
          nix develop --command python components/bello-hardware-python/scripts/generate_proto.py
          git diff --exit-code -- components/bello-hardware-python/src/bello_hardware/_generated
      - name: Python client
        working-directory: components/bello-hardware-python
        run: |
          nix develop --command ruff format --check .
          nix develop --command ruff check .
          nix develop --command mypy src/bello_hardware tests
          nix develop --command pytest
          nix develop --command python -m hatchling build
          cmp LICENSE ../../LICENSE
          hardware_sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          hardware_wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          tar -xO --wildcards -f "$hardware_sdist" '*/LICENSE' | cmp - ../../LICENSE
          unzip -p "$hardware_wheel" '*/licenses/LICENSE' | cmp - ../../LICENSE
          for artifact in "$hardware_sdist" "$hardware_wheel"; do
            metadata_pattern='*/PKG-INFO'
            metadata_command=(tar -xO --wildcards -f)
            if [[ "$artifact" == *.whl ]]; then
              metadata_pattern='*/METADATA'
              metadata_command=(unzip -p)
            fi
            "${metadata_command[@]}" "$artifact" "$metadata_pattern" |
              grep -Fx 'License-Expression: MIT'
            "${metadata_command[@]}" "$artifact" "$metadata_pattern" |
              grep -Fx 'License-File: LICENSE'
            "${metadata_command[@]}" "$artifact" "$metadata_pattern" |
              grep -Fx 'Classifier: Private :: Do Not Upload'
          done
      - name: Verify the installed Python client
        working-directory: components/bello-hardware-python
        run: |
          python3 -m venv "$RUNNER_TEMP/client-venv"
          python="$RUNNER_TEMP/client-venv/bin/python"
          "$python" -m pip install dist/*.whl
          "$python" -I -c 'from bello_hardware import Robot, api; api.ListHardwareRequest()'
      - name: Create SocketCAN test interface
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set dev vcan0 up
      - name: Test Linker O6 on two isolated Linux CAN pairs
        run: |
          nix develop --command cargo run -p bello-sim -- check --config components/bello-sim/config/milly_7dof_o6_gimbal.yaml
          nix develop --command cargo run -p bello-hardwared -- --check --config components/bello-hardwared/config/milly-7dof-o6-gimbal.yaml
          cmp components/bello-hand/LICENSE LICENSE
          sudo modprobe vxcan
          sudo env PATH=/usr/sbin:/usr/bin:/sbin:/bin bash components/bello-hand/tests/run-socketcan.sh
      - name: Test the SocketCAN backend
        run: nix develop --command cargo e2e-vcan
